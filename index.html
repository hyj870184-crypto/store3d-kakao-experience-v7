<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>다이클로 매장 3D 체험</title><meta name="theme-color" content="#10151d"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111722;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}#app,#v{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:absolute;z-index:5;left:10px;right:10px;top:10px;display:flex;justify-content:center;gap:6px;pointer-events:none}.top button{pointer-events:auto;border:1px solid rgba(255,255,255,.25);background:rgba(15,21,30,.72);color:#fff;border-radius:999px;padding:10px 13px;font-size:12px;font-weight:700;backdrop-filter:blur(8px)}.ctrl{position:absolute;z-index:6;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.move{pointer-events:auto;width:92px;height:92px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(13,20,31,.72);color:#fff;font-size:14px;font-weight:800;backdrop-filter:blur(8px)}.move:active{transform:scale(.97);background:rgba(37,83,140,.88)}.hint{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:126px;background:rgba(13,20,31,.62);color:#fff;border-radius:999px;padding:8px 12px;font-size:11px;white-space:nowrap}.cross{position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);z-index:4;pointer-events:none}.cross:before,.cross:after{content:"";position:absolute;background:#fff;opacity:.85}.cross:before{left:7px;top:0;width:2px;height:16px}.cross:after{top:7px;left:0;width:16px;height:2px}.intro{position:absolute;z-index:20;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:24px 18px calc(28px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(5,8,12,.08),rgba(5,8,12,.18) 35%,rgba(5,8,12,.88));color:white}.card{width:min(520px,100%);text-align:center}.ey{font-size:11px;letter-spacing:.1em;opacity:.72;font-weight:800}.card h1{font-size:28px;line-height:1.2;margin:8px 0}.card p{font-size:13px;line-height:1.6;opacity:.84}.facts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0}.facts span{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);border-radius:999px;padding:6px 9px;font-size:10px}.start{width:100%;min-height:58px;border:0;border-radius:16px;font-size:17px;font-weight:900;background:white;color:#111722}.badge{position:absolute;z-index:5;left:50%;top:58px;transform:translateX(-50%);background:rgba(15,21,30,.65);color:#fff;border-radius:999px;padding:6px 10px;font-size:10px;white-space:nowrap}.hidden{display:none!important}@media(min-width:900px){.move{width:110px;height:110px}.hint{bottom:145px}}</style></head><body><div id="app"><div id="v"></div><div class="top hidden" id="top"><button data-view="entrance">입구</button><button data-view="counter">계산대</button><button data-view="center">중앙</button></div><div class="badge">실제 mm 비율 · 눈높이 1,600mm · FOV 60°</div><div class="cross hidden" id="cross"></div><div class="hint hidden" id="hint">화면을 손가락으로 드래그해 둘러보세요</div><div class="ctrl hidden" id="ctrl"><button class="move" id="back">▼ 뒤로</button><button class="move" id="fwd">▲ 앞으로</button></div><div class="intro" id="intro"><div class="card"><div class="ey">DAICLO STORE · 3D WALKTHROUGH</div><h1>실제 매장 크기로<br>직접 걸어보세요</h1><p>도면의 실제 치수를 mm 단위로 반영했습니다.<br>손가락으로 둘러보고 버튼을 눌러 이동하세요.</p><div class="facts"><span>층고 3,000mm</span><span>눈높이 1,600mm</span><span>판매공간 6,050×5,130mm</span></div><button class="start" id="start">매장 체험 시작하기</button></div></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.181.1/+esm';const host=document.getElementById('v');const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.12;host.appendChild(r.domElement);const s=new THREE.Scene();s.background=new THREE.Color(0xdfe6eb);s.fog=new THREE.Fog(0xdfe6eb,13000,24000);const c=new THREE.PerspectiveCamera(60,1,10,40000);c.rotation.order='YXZ';const hemi=new THREE.HemisphereLight(0xf7fbff,0x68727c,2.1);s.add(hemi);const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(1800,4200,2600);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);s.add(sun);const mats={floor:new THREE.MeshStandardMaterial({color:0xd6d0c7,roughness:.83}),wall:new THREE.MeshStandardMaterial({color:0xf4f1eb,roughness:.9}),dark:new THREE.MeshStandardMaterial({color:0x222b33,roughness:.45}),white:new THREE.MeshStandardMaterial({color:0xe9edf0,metalness:.16,roughness:.38}),cold:new THREE.MeshStandardMaterial({color:0xb9cbd8,metalness:.28,roughness:.32}),glass:new THREE.MeshPhysicalMaterial({color:0xb9d9e8,transparent:true,opacity:.22,roughness:.08,transmission:.55}),shelf:new THREE.MeshStandardMaterial({color:0xb7a48c,roughness:.62}),counter:new THREE.MeshStandardMaterial({color:0x8b735f,roughness:.55}),accent:new THREE.MeshStandardMaterial({color:0x2a517d,roughness:.45})};const coll=[];function box(w,h,d,mat,x,z,y=h/2,rot=0,collide=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.rotation.y=rot*Math.PI/180;m.castShadow=true;m.receiveShadow=true;s.add(m);if(collide)coll.push({x,z,w:Math.abs(Math.cos(m.rotation.y))*w+Math.abs(Math.sin(m.rotation.y))*d,d:Math.abs(Math.sin(m.rotation.y))*w+Math.abs(Math.cos(m.rotation.y))*d});return m}box(6050,80,5130,mats.floor,3025,2565,0,0,false);box(3160,80,3010,mats.floor,7630,3625,0,0,false);box(6215,3000,380,mats.wall,3107,0);box(380,3000,4230,mats.wall,0,2115);box(210,3000,310,mats.wall,6155,2120);box(2090,3000,310,mats.wall,8165,2120);box(380,3000,3010,mats.wall,9210,3625);box(120,3000,1660,mats.wall,6050,2950);box(120,3000,490,mats.wall,6050,4885);const fw=box(5020,2300,35,mats.glass,3410,5130,1150,0,false);const sw=box(2800,2300,35,mats.glass,7810,5130,1150,0,false);const data=[['냉동고',650,640,1900,520,470,0,'cold'],['음료냉장고',650,640,1900,1170,470,0,'cold'],['냉동고',650,640,1900,1820,470,0,'cold'],['음료냉장고',650,640,1900,2470,470,0,'cold'],['냉동고',650,640,1900,3120,470,0,'cold'],['냉동고',650,640,1900,3770,470,0,'cold'],['냉동고',650,640,1900,4420,470,0,'cold'],['음료냉장고',650,640,1900,5100,470,0,'cold'],['진열대',900,500,1800,520,1870,90,'shelf'],['진열대',900,500,1800,520,2870,90,'shelf'],['키오스크',900,600,900,900,3670,90,'dark'],['이동매대',1500,605,800,2200,1900,90,'shelf'],['이동매대',1500,605,800,2200,3150,90,'shelf'],['진열대',900,450,1530,3250,2200,90,'shelf'],['진열대',900,450,1530,3700,2200,90,'shelf'],['진열대',900,450,1530,3250,3150,90,'shelf'],['진열대',900,450,1530,3700,3150,90,'shelf'],['아이스크림 냉동고',1815,670,820,4570,3500,0,'cold'],['카운터',2000,600,900,4880,4250,90,'counter'],['에어컨',590,300,1840,5630,2850,90,'white']];for(const [n,w,d,h,x,z,rot,mat] of data){const g=box(w,h,d,mats[mat],x,z,h/2,rot);g.userData.name=n;if(mat==='cold'){for(let k=0;k<4;k++)box(w*.82,18,d*.72,mats.glass,x,z,350+k*330,rot,false)}if(n==='카운터')box(360,260,190,mats.dark,x-420,z,h+130,rot,false)}for(let x=900;x<5600;x+=1100){const l=new THREE.RectAreaLight?null:null}for(let i=0;i<6;i++){const p=new THREE.PointLight(0xfff4df,.8,3000,2);p.position.set(700+i*950,2750,1200+(i%2)*2100);s.add(p)}const starts={entrance:{p:[700,1600,4650],t:[3000,1450,2200]},counter:{p:[5450,1600,4250],t:[1700,1450,3500]},center:{p:[2600,1600,3400],t:[3300,1450,900]}};let yaw=0,pitch=0,active=false,forward=false,backward=false,last=null;function safe(nx,nz){if(nx<260||nx>5790||nz<250||nz>4880)return false;for(const o of coll){if(Math.abs(nx-o.x)<o.w/2+220&&Math.abs(nz-o.z)<o.d/2+220)return false}return true}function spawn(k){const v=starts[k];c.position.set(...v.p);c.lookAt(new THREE.Vector3(...v.t));c.rotation.order='YXZ';yaw=c.rotation.y;pitch=c.rotation.x}spawn('entrance');function resize(){const w=innerWidth,h=innerHeight;r.setSize(w,h,false);c.aspect=w/h;c.updateProjectionMatrix()}addEventListener('resize',resize);resize();function look(dx,dy){yaw-=dx*.0042;pitch-=dy*.0036;pitch=Math.max(-1.15,Math.min(1.15,pitch));c.rotation.set(pitch,yaw,0)}r.domElement.addEventListener('pointerdown',e=>{if(!active)return;last={x:e.clientX,y:e.clientY,id:e.pointerId};try{r.domElement.setPointerCapture(e.pointerId)}catch{}});r.domElement.addEventListener('pointermove',e=>{if(!active||!last||e.pointerId!==last.id)return;look(e.clientX-last.x,e.clientY-last.y);last.x=e.clientX;last.y=e.clientY});r.domElement.addEventListener('pointerup',()=>last=null);r.domElement.addEventListener('pointercancel',()=>last=null);function hold(el,set){el.addEventListener('pointerdown',e=>{set(true);el.setPointerCapture?.(e.pointerId);e.preventDefault()});['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,e=>{set(false);e.preventDefault()}))}hold(document.getElementById('fwd'),v=>forward=v);hold(document.getElementById('back'),v=>backward=v);document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>spawn(b.dataset.view));document.getElementById('start').onclick=()=>{active=true;document.getElementById('intro').classList.add('hidden');['top','ctrl','hint','cross'].forEach(id=>document.getElementById(id).classList.remove('hidden'));setTimeout(()=>document.getElementById('hint').classList.add('hidden'),4500)};let prev=performance.now();function tick(now){requestAnimationFrame(tick);const dt=Math.min(.04,(now-prev)/1000);prev=now;if(active&&(forward||backward)){const dir=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));if(backward)dir.multiplyScalar(-1);const nx=c.position.x+dir.x*1250*dt,nz=c.position.z+dir.z*1250*dt;if(safe(nx,c.position.z))c.position.x=nx;if(safe(c.position.x,nz))c.position.z=nz}r.render(s,c)}requestAnimationFrame(tick);</script></body></html>
