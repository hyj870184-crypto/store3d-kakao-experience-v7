<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>다이클로 매장 3D 모델하우스 체험</title>
<meta name="theme-color" content="#f4f1eb">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e5df;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#20242a}#app,#v{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
.topbar{position:absolute;z-index:10;left:50%;top:16px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:rgba(255,255,255,.82);border:1px solid rgba(40,44,50,.10);border-radius:999px;box-shadow:0 10px 28px rgba(38,42,48,.10);backdrop-filter:blur(14px)}
.topbar button{border:0;background:transparent;color:#333941;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:700;white-space:nowrap}.topbar button.active{background:#222831;color:#fff}.topbar button.tour{background:#ece7df;color:#292f36}
.brand{position:absolute;z-index:8;left:18px;top:18px;background:rgba(255,255,255,.80);border:1px solid rgba(40,44,50,.08);border-radius:14px;padding:10px 12px;backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(38,42,48,.08)}.brand b{display:block;font-size:12px}.brand span{display:block;margin-top:2px;font-size:10px;color:#69717a}
.guide{position:absolute;z-index:8;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(28,31,36,.72);color:white;border-radius:999px;padding:9px 14px;font-size:11px;backdrop-filter:blur(10px);white-space:nowrap;transition:.25s}
.movebar{position:absolute;z-index:9;right:18px;bottom:18px;display:flex;gap:8px}.movebar button{width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.42);background:rgba(31,35,40,.74);color:white;font-size:18px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.16);backdrop-filter:blur(10px)}.movebar button:active{transform:scale(.96);background:rgba(31,35,40,.90)}
.intro{position:absolute;z-index:30;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:28px 18px calc(30px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(245,242,236,.08),rgba(245,242,236,.08) 36%,rgba(21,24,28,.74));color:#fff}.introcard{width:min(560px,100%);text-align:center}.introcard .eyebrow{font-size:10px;letter-spacing:.16em;font-weight:800;opacity:.74}.introcard h1{font-size:30px;line-height:1.25;margin:9px 0 8px}.introcard p{font-size:13px;line-height:1.6;opacity:.86;margin:0 0 16px}.facts{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}.facts span{font-size:10px;padding:6px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08)}.startrow{display:grid;grid-template-columns:1.25fr .9fr;gap:8px}.startrow button{min-height:56px;border:0;border-radius:16px;font-size:15px;font-weight:900}.startrow .primary{background:#fff;color:#1e2329}.startrow .secondary{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22)}
.hidden{display:none!important}
@media(max-width:720px){.brand{display:none}.topbar{top:10px;max-width:calc(100% - 18px);overflow:auto;justify-content:flex-start}.topbar button{padding:8px 10px;font-size:11px}.movebar{right:12px;bottom:12px}.movebar button{width:54px;height:54px}.guide{bottom:78px;font-size:10px}.introcard h1{font-size:25px}.startrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><div id="v"></div>
<div class="brand"><b>DAICLO STORE</b><span>실제 치수 기반 3D 체험</span></div>
<div class="topbar hidden" id="topbar"><button data-view="entrance" class="active">입구</button><button data-view="center">중앙</button><button data-view="counter">계산대</button><button id="tourBtn" class="tour">자동 둘러보기</button></div>
<div class="guide hidden" id="guide">화면을 천천히 드래그해 둘러보세요</div>
<div class="movebar hidden" id="movebar"><button id="back" aria-label="뒤로">↓</button><button id="fwd" aria-label="앞으로">↑</button></div>
<div class="intro" id="intro"><div class="introcard"><div class="eyebrow">MODEL HOUSE STYLE WALKTHROUGH</div><h1>실제 매장에 들어온 것처럼<br>공간을 천천히 둘러보세요</h1><p>도면의 실제 mm 비율과 1,600mm 눈높이를 유지하고<br>시야와 이동을 모델하우스 체험처럼 부드럽게 조정했습니다.</p><div class="facts"><span>층고 3,000mm</span><span>눈높이 1,600mm</span><span>판매공간 6,050×5,130mm</span></div><div class="startrow"><button class="primary" id="start">직접 둘러보기</button><button class="secondary" id="autoStart">자동 관람</button></div></div></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.181.1/+esm';
const host=document.getElementById('v');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.03;host.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe7e3dd);scene.fog=new THREE.Fog(0xe7e3dd,15000,26000);
const camera=new THREE.PerspectiveCamera(52,1,20,40000);camera.rotation.order='YXZ';
scene.add(new THREE.HemisphereLight(0xfaf8f4,0x817b73,1.35));
const key=new THREE.DirectionalLight(0xfff8ec,1.55);key.position.set(2200,5200,3600);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-7000;key.shadow.camera.right=7000;key.shadow.camera.top=7000;key.shadow.camera.bottom=-7000;scene.add(key);
const fill=new THREE.DirectionalLight(0xdde9f2,.55);fill.position.set(6500,3500,7000);scene.add(fill);
const mats={
 floor:new THREE.MeshStandardMaterial({color:0xd8d2c9,roughness:.78,metalness:.02}),
 ceiling:new THREE.MeshStandardMaterial({color:0xf4f1ec,roughness:.96}),
 wall:new THREE.MeshStandardMaterial({color:0xf1eee8,roughness:.9}),
 trim:new THREE.MeshStandardMaterial({color:0x3c434a,roughness:.42,metalness:.22}),
 metal:new THREE.MeshStandardMaterial({color:0xadb6bd,roughness:.34,metalness:.55}),
 fridge:new THREE.MeshStandardMaterial({color:0xd7dfe4,roughness:.30,metalness:.24}),
 shelf:new THREE.MeshStandardMaterial({color:0xb79b78,roughness:.58}),
 shelfDark:new THREE.MeshStandardMaterial({color:0x5f5143,roughness:.6}),
 counter:new THREE.MeshStandardMaterial({color:0x94765e,roughness:.5}),
 white:new THREE.MeshStandardMaterial({color:0xf0f2f2,roughness:.42,metalness:.10}),
 dark:new THREE.MeshStandardMaterial({color:0x20262c,roughness:.38,metalness:.12}),
 glass:new THREE.MeshPhysicalMaterial({color:0xd4e6ed,transparent:true,opacity:.26,roughness:.06,transmission:.72,thickness:12}),
 glassDark:new THREE.MeshPhysicalMaterial({color:0x9fb8c2,transparent:true,opacity:.34,roughness:.05,transmission:.56,thickness:8}),
 light:new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xfff5de,emissiveIntensity:2.5,roughness:.25})
};
const coll=[];
function meshBox(w,h,d,mat,x,z,y=h/2,rot=0,collide=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.rotation.y=rot*Math.PI/180;m.castShadow=true;m.receiveShadow=true;scene.add(m);if(collide){const a=m.rotation.y;coll.push({x,z,w:Math.abs(Math.cos(a))*w+Math.abs(Math.sin(a))*d,d:Math.abs(Math.sin(a))*w+Math.abs(Math.cos(a))*d})}return m}
function addFloor(){meshBox(6050,70,5130,mats.floor,3025,2565,0,0,false);meshBox(3160,70,3010,mats.floor,7630,3625,0,0,false);for(let x=0;x<=6050;x+=600){meshBox(7,4,5130,new THREE.MeshStandardMaterial({color:0xc9c2b9,roughness:.9}),x,2565,38,0,false)}for(let z=0;z<=5130;z+=600){meshBox(6050,4,7,new THREE.MeshStandardMaterial({color:0xc9c2b9,roughness:.9}),3025,z,38,0,false)}}
function addShell(){meshBox(6215,3000,380,mats.wall,3107,0);meshBox(380,3000,4230,mats.wall,0,2115);meshBox(210,3000,310,mats.wall,6155,2120);meshBox(2090,3000,310,mats.wall,8165,2120);meshBox(380,3000,3010,mats.wall,9210,3625);meshBox(120,3000,1660,mats.wall,6050,2950);meshBox(120,3000,490,mats.wall,6050,4885);meshBox(6050,90,5130,mats.ceiling,3025,2565,3000,0,false);meshBox(3160,90,3010,mats.ceiling,7630,3625,3000,0,false);meshBox(5020,2300,35,mats.glass,3410,5130,1150,0,false);meshBox(2800,2300,35,mats.glass,7810,5130,1150,0,false);meshBox(5020,55,65,mats.trim,3410,5130,2275,0,false);meshBox(2800,55,65,mats.trim,7810,5130,2275,0,false)}
function fridge(w,d,h,x,z,name){meshBox(w,h,d,mats.fridge,x,z,h/2,0,true);meshBox(w-50,h-120,24,mats.glassDark,x,z+d/2+12,h/2+15,0,false);for(let k=1;k<4;k++)meshBox(w-85,16,d-100,mats.metal,x,z,390+k*330,0,false);meshBox(w-30,55,d+20,mats.trim,x,z,h-28,0,false);meshBox(18,h-180,25,mats.trim,x+w*.34,z+d/2+24,h/2,0,false)}
function shelf(w,d,h,x,z,rot=0){meshBox(w,h,d,mats.shelfDark,x,z,h/2,rot,true);const a=rot*Math.PI/180;for(let k=0;k<4;k++){const yy=260+k*(h-360)/3;meshBox(w-80,34,d+24,mats.shelf,x,z,yy,rot,false)}meshBox(52,h-80,52,mats.trim,x-Math.cos(a)*w*.43,z+Math.sin(a)*w*.43,h/2,rot,false);meshBox(52,h-80,52,mats.trim,x+Math.cos(a)*w*.43,z-Math.sin(a)*w*.43,h/2,rot,false)}
function kiosk(x,z){meshBox(560,820,420,mats.dark,x,z,410,90,true);meshBox(430,300,30,mats.glassDark,x-220,z,690,90,false);meshBox(180,760,170,mats.trim,x+180,z,380,90,false)}
function counter(x,z){meshBox(2000,900,600,mats.counter,x,z,450,90,true);meshBox(2040,50,640,mats.dark,x,z,925,90,false);meshBox(380,260,200,mats.dark,x-370,z,1080,90,false);meshBox(250,18,140,mats.glassDark,x-370,z-110,1150,90,false)}
function icecream(x,z){meshBox(1815,820,670,mats.white,x,z,410,0,true);meshBox(1715,34,560,mats.glassDark,x,z,844,0,false);meshBox(90,40,560,mats.trim,x,z,866,0,false)}
function aircon(x,z){meshBox(590,1840,300,mats.white,x,z,920,90,true);for(let i=0;i<7;i++)meshBox(400,7,18,mats.trim,x-158,z,1430-i*33,90,false)}
addFloor();addShell();
[[520,470,'냉동고'],[1170,470,'음료냉장고'],[1820,470,'냉동고'],[2470,470,'음료냉장고'],[3120,470,'냉동고'],[3770,470,'냉동고'],[4420,470,'냉동고'],[5100,470,'음료냉장고']].forEach(v=>fridge(650,640,1900,...v));
shelf(900,500,1800,520,1870,90);shelf(900,500,1800,520,2870,90);kiosk(900,3670);shelf(1500,605,800,2200,1900,90);shelf(1500,605,800,2200,3150,90);shelf(900,450,1530,3250,2200,90);shelf(900,450,1530,3700,2200,90);shelf(900,450,1530,3250,3150,90);shelf(900,450,1530,3700,3150,90);icecream(4570,3500);counter(4880,4250);aircon(5630,2850);
for(let x=650;x<=5400;x+=950){for(const z of [1250,3750]){meshBox(480,24,180,mats.light,x,z,2928,0,false);const p=new THREE.PointLight(0xfff4df,.62,2300,2);p.position.set(x,2840,z);scene.add(p)}}
const starts={entrance:{p:[900,1600,4650],t:[2900,1500,2350]},center:{p:[2580,1600,3500],t:[3220,1500,1200]},counter:{p:[5450,1600,4300],t:[1750,1500,3550]}};
let yaw=0,pitch=0,targetYaw=0,targetPitch=0,active=false,forward=false,backward=false,last=null,tour=false,tourT=0,tourIndex=0;
function safe(nx,nz){if(nx<280||nx>5770||nz<270||nz>4870)return false;for(const o of coll){if(Math.abs(nx-o.x)<o.w/2+185&&Math.abs(nz-o.z)<o.d/2+185)return false}return true}
function setCam(pos,target){camera.position.set(...pos);camera.lookAt(new THREE.Vector3(...target));camera.rotation.order='YXZ';yaw=targetYaw=camera.rotation.y;pitch=targetPitch=camera.rotation.x}
function spawn(key){tour=false;tourBtn.textContent='자동 둘러보기';const v=starts[key];setCam(v.p,v.t);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===key))}
setCam(starts.entrance.p,starts.entrance.t);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function look(dx,dy){targetYaw-=dx*.0024;targetPitch-=dy*.0020;targetPitch=Math.max(-.72,Math.min(.62,targetPitch))}
renderer.domElement.addEventListener('pointerdown',e=>{if(!active||tour)return;last={x:e.clientX,y:e.clientY,id:e.pointerId};try{renderer.domElement.setPointerCapture(e.pointerId)}catch{}});
renderer.domElement.addEventListener('pointermove',e=>{if(!last||e.pointerId!==last.id)return;look(e.clientX-last.x,e.clientY-last.y);last.x=e.clientX;last.y=e.clientY});renderer.domElement.addEventListener('pointerup',()=>last=null);renderer.domElement.addEventListener('pointercancel',()=>last=null);
function hold(el,set){el.addEventListener('pointerdown',e=>{tour=false;set(true);el.setPointerCapture?.(e.pointerId);e.preventDefault()});['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,e=>{set(false);e.preventDefault()}))}
hold(document.getElementById('fwd'),v=>forward=v);hold(document.getElementById('back'),v=>backward=v);
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>spawn(b.dataset.view));
const tourBtn=document.getElementById('tourBtn');const waypoints=[{p:[900,1600,4650],t:[2800,1450,2450],d:4.5},{p:[1750,1600,4000],t:[3300,1450,2200],d:4.5},{p:[2750,1600,3500],t:[3600,1450,1800],d:4.5},{p:[4200,1600,3750],t:[2400,1450,2400],d:4.8},{p:[5350,1600,4300],t:[1700,1450,3500],d:5.2}];
function startTour(){tour=true;tourT=0;tourIndex=0;tourBtn.textContent='자동 관람 중';}
tourBtn.onclick=()=>{if(tour){tour=false;tourBtn.textContent='자동 둘러보기'}else startTour()};
function reveal(){active=true;document.getElementById('intro').classList.add('hidden');['topbar','guide','movebar'].forEach(id=>document.getElementById(id).classList.remove('hidden'));setTimeout(()=>document.getElementById('guide').style.opacity='.35',4200)}
document.getElementById('start').onclick=()=>{reveal();spawn('entrance')};document.getElementById('autoStart').onclick=()=>{reveal();startTour()};
let prev=performance.now();
function tick(now){requestAnimationFrame(tick);const dt=Math.min(.035,(now-prev)/1000);prev=now;
 if(tour){const a=waypoints[tourIndex],b=waypoints[Math.min(tourIndex+1,waypoints.length-1)];tourT+=dt;const q=Math.min(1,tourT/a.d),e=q*q*(3-2*q);camera.position.lerpVectors(new THREE.Vector3(...a.p),new THREE.Vector3(...b.p),e);const ta=new THREE.Vector3(...a.t),tb=new THREE.Vector3(...b.t),tt=ta.lerp(tb,e);camera.lookAt(tt);camera.rotation.order='YXZ';yaw=targetYaw=camera.rotation.y;pitch=targetPitch=camera.rotation.x;if(q>=1){tourT=0;if(tourIndex<waypoints.length-2)tourIndex++;else{tour=false;tourBtn.textContent='자동 둘러보기'}}}
 else{yaw+=(targetYaw-yaw)*Math.min(1,dt*8);pitch+=(targetPitch-pitch)*Math.min(1,dt*8);camera.rotation.set(pitch,yaw,0);if(active&&(forward||backward)){const dir=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));if(backward)dir.multiplyScalar(-1);const speed=720;const nx=camera.position.x+dir.x*speed*dt,nz=camera.position.z+dir.z*speed*dt;if(safe(nx,camera.position.z))camera.position.x=nx;if(safe(camera.position.x,nz))camera.position.z=nz}}
 renderer.render(scene,camera)}requestAnimationFrame(tick);
</script>
</body>
</html>
